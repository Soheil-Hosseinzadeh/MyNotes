  <rect x="0" y="0" width="688.1288452148438" height="501.66665649414074" fill="#ffffff"/><g transform="translate(10 10) rotate(0 334.0644226074219 240.83332824707037)"><text x="0" y="21.072916221618655" font-family="Comic Shanns, Segoe UI Emoji" font-size="24.083332824707036px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">function sequence(d[0..n]): k, array[1..k]</text><text x="0" y="51.17708225250245" font-family="Comic Shanns, Segoe UI Emoji" font-size="24.083332824707036px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">  array j[0..n]</text><text x="0" y="81.28124828338625" font-family="Comic Shanns, Segoe UI Emoji" font-size="24.083332824707036px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="0" y="111.38541431427005" font-family="Comic Shanns, Segoe UI Emoji" font-size="24.083332824707036px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">  d[0] ← j[0] ← 0</text><text x="0" y="141.48958034515385" font-family="Comic Shanns, Segoe UI Emoji" font-size="24.083332824707036px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">  k ← j[1] ← 1</text><text x="0" y="171.59374637603764" font-family="Comic Shanns, Segoe UI Emoji" font-size="24.083332824707036px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="0" y="201.69791240692143" font-family="Comic Shanns, Segoe UI Emoji" font-size="24.083332824707036px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">  for i ← 2 to n do</text><text x="0" y="231.80207843780522" font-family="Comic Shanns, Segoe UI Emoji" font-size="24.083332824707036px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">    r ← k</text><text x="0" y="261.906244468689" font-family="Comic Shanns, Segoe UI Emoji" font-size="24.083332824707036px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">    while d[j[r]] &gt; max(d[i], r) do r ← r - 1</text><text x="0" y="292.0104104995728" font-family="Comic Shanns, Segoe UI Emoji" font-size="24.083332824707036px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">    if d[i] &gt; r then</text><text x="0" y="322.1145765304566" font-family="Comic Shanns, Segoe UI Emoji" font-size="24.083332824707036px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">      for m ← k - 1 to r + 1 do j[m + 1] ← j[m]</text><text x="0" y="352.2187425613404" font-family="Comic Shanns, Segoe UI Emoji" font-size="24.083332824707036px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">      j[r + 1] ← i</text><text x="0" y="382.3229085922242" font-family="Comic Shanns, Segoe UI Emoji" font-size="24.083332824707036px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">      k ← k + 1</text><text x="0" y="412.427074623108" font-family="Comic Shanns, Segoe UI Emoji" font-size="24.083332824707036px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">      </text><text x="0" y="442.5312406539918" font-family="Comic Shanns, Segoe UI Emoji" font-size="24.083332824707036px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">  return k, j[1..k]</text><text x="0" y="472.6354066848756" font-family="Comic Shanns, Segoe UI Emoji" font-size="24.083332824707036px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/></g></svg>